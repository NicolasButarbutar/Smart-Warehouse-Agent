[project]
name = "smart-warehouse-agent"
version = "0.2.0"
description = "Smart Warehouse Management Agent - Milestone 2: Constraint Solver CSP (AC-3 + Backtracking MRV) untuk Penjadwalan Shift Staf & Optimasi Sumber Daya Gudang"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicolas J Grace Butarbutar" },
    { name = "Indah Triyuni Siahaan" },
    { name = "Swasti Maristella Sihombing" },
]
dependencies = [
    "openpyxl>=3.1.5",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
