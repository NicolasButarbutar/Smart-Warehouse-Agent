[project]
name = "smart-warehouse-agent"
version = "0.1.0"
description = "Smart Warehouse Management Agent untuk Optimasi Penyimpanan Barang - Milestone 1 (Problem Framing, PEAS, Baseline Search)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicolas J Grace Butarbutar" },
    { name = "Indah Triyuni Siahaan" },
    { name = "Swasti Maristella Sihombing" },
]
dependencies = []
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
